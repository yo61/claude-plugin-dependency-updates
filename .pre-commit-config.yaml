repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-case-conflict
      - id: mixed-line-ending
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/jdx/jactionlint
    rev: 1027f0a131ab98bc7e191d995bfa15dbed5bbf8f  # frozen: v2.2.0
    hooks:
      - id: jactionlint

  # shellcheck and shfmt run from the system install rather than a pinned hook
  # repo, so the flags here are byte-identical to the ones CI and the editor
  # use. The four shfmt flags are the project standard: -i 2 two-space indent,
  # -bn binary operators may start a line, -ci case arms indented under the
  # case, -sr space after redirect operators. Note `-i2` is NOT valid — Go's
  # flag parser reads it as a flag named `i2` and shfmt exits without
  # formatting, silently.
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]

      - id: shfmt
        name: shfmt
        entry: shfmt -i 2 -bn -ci -sr -w
        language: system
        types: [shell]

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies:
          - "@commitlint/config-conventional@^21.2.4"
